<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TRIMA - Conteo Cíclico V2</title>

<script src="https://unpkg.com/@zxing/browser@latest"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#1f2937}
.app{max-width:520px;margin:auto;padding:18px}
.header{background:#173f6d;color:#fff;border-radius:16px;padding:22px 18px;text-align:center;margin-bottom:16px}
.header h1{margin:0;font-size:30px}
.header p{margin:5px 0 0;font-size:15px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
#estadoSistema{text-align:center;font-size:16px;line-height:1.45}
.cargando{color:#8a5b00;background:#fff6dd}
.listo{color:#146c35;background:#e7f6eb}
.error{color:#a61b1b;background:#fdeaea}
.titulo{font-size:18px;font-weight:bold;margin-bottom:12px}
input{width:100%;padding:16px;border:2px solid #d5dae1;border-radius:12px;font-size:18px;margin-bottom:10px}
button{width:100%;padding:17px;border:0;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.btnBuscar{background:#173f6d;color:#fff;margin-bottom:10px}
.btnScanner{background:#2f6fec;color:#fff}
#visor{display:none;position:relative;overflow:hidden;border-radius:16px;background:#000;margin-top:15px}
video{width:100%;display:block;min-height:360px;object-fit:cover}
.marco{position:absolute;left:6%;right:6%;top:38%;height:24%;border:4px solid #fff;border-left-width:7px;border-right-width:7px;pointer-events:none}
.linea{position:absolute;left:9%;right:9%;top:50%;height:3px;background:red;pointer-events:none}
#estadoScanner{display:none;margin-top:12px;padding:13px;border-radius:10px;text-align:center;background:#eef4ff;color:#173f6d}
#producto{display:none}
.estadoProducto{padding:14px;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;margin-bottom:18px}
.productoActivo{background:#e6f5e9;color:#137333}
.productoDesactivado{background:#fde7e7;color:#b3261e}
.descripcion{font-size:25px;font-weight:bold;line-height:1.25;margin-bottom:20px}
.dato{padding:13px 0;border-top:1px solid #ddd;font-size:17px}
.dato strong{color:#173f6d}
.stock{margin-top:18px;padding:22px;border-radius:14px;background:#eef3fb;text-align:center}
.stockTitulo{font-size:17px}
.stockNumero{font-size:46px;font-weight:bold;color:#173f6d;margin-top:6px}
.tiempo{margin-top:15px;text-align:center;color:#667085;font-size:13px}
#zonaConteo{display:none}
.btnCoincide{background:#78bd91;color:#fff;margin-bottom:22px}
.btnGuardar{background:#204c7d;color:#fff}
.btnSiguiente{display:none;background:#3474eb;color:#fff;margin-top:14px}
.ayuda{color:#666;font-size:14px;margin-bottom:18px}
.resultado{display:none;margin-top:18px;padding:18px;border-radius:12px;background:#e6f6ea;color:#126b35;text-align:center;font-size:18px;font-weight:bold}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <h1>TRIMA</h1>
    <p>CONTEO CÍCLICO DE INVENTARIO · V2</p>
  </div>

  <div id="estadoSistema" class="card cargando">
    ⏳ <strong>Preparando catálogo TRIMA...</strong><br>
    Espera un momento antes de comenzar.
  </div>

  <div class="card">
    <div class="titulo">BUSCAR PRODUCTO</div>

    <input id="busqueda" type="text" inputmode="text" autocomplete="off"
           placeholder="Código de barras / código proveedor" disabled>

    <button id="btnBuscar" class="btnBuscar" type="button" disabled>
      🔎 BUSCAR
    </button>

    <button id="btnScanner" class="btnScanner" type="button" disabled>
      📷 ESCANEAR CÓDIGO DE BARRAS
    </button>

    <div id="visor">
      <video id="video" autoplay muted playsinline></video>
      <div class="marco"></div>
      <div class="linea"></div>
    </div>

    <div id="estadoScanner"></div>
  </div>

  <div id="producto" class="card">
    <div id="estadoProducto" class="estadoProducto"></div>
    <div id="descripcion" class="descripcion"></div>

    <div class="dato"><strong>Código proveedor:</strong> <span id="codigoProveedor"></span></div>
    <div class="dato"><strong>Código de barras:</strong> <span id="codigoBarras"></span></div>
    <div class="dato"><strong>ID ERP:</strong> <span id="idERP"></span></div>

    <div class="stock">
      <div class="stockTitulo">STOCK ERP</div>
      <div id="stockERP" class="stockNumero"></div>
    </div>

    <div id="tiempoBusqueda" class="tiempo"></div>
  </div>

  <div id="zonaConteo" class="card">
    <button id="btnCoincide" class="btnCoincide" type="button">
      ✓ STOCK FÍSICO COINCIDE CON ERP
    </button>

    <div class="titulo">CONTEO FÍSICO</div>

    <input id="conteoFisico" type="number" min="0" step="1" inputmode="numeric"
           placeholder="Cantidad encontrada">

    <div class="ayuda">
      Captura únicamente si la cantidad física es distinta al Stock ERP.
    </div>

    <button id="btnGuardarConteo" class="btnGuardar" type="button">
      GUARDAR CONTEO FÍSICO
    </button>

    <div id="resultadoGuardado" class="resultado"></div>

    <button id="btnSiguiente" class="btnSiguiente" type="button">
      📷 ESCANEAR SIGUIENTE PRODUCTO
    </button>
  </div>

</div>

<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycbxLuRTDM0DHJ6mHinM0yyylBgSk7a8fCszae4Ryc4KlWhZ7hRr9zwp1IRmr-BeGn1468A/exec";

let catalogo = [];
let indiceCatalogo = new Map();
let catalogoListo = false;

let productoActual = null;
let codigoActual = "";

let stream = null;
let controles = null;
let detectado = false;
let guardando = false;

const $ = id => document.getElementById(id);

function normalizarCodigo(valor) {
  return String(valor ?? "").trim().toUpperCase();
}

function escaparHTML(texto) {
  return String(texto ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =====================================================
   1. CARGA ÚNICA DEL CATÁLOGO
===================================================== */
function cargarCatalogo() {
  const estado = $("estadoSistema");
  const callback = "catalogoTRIMA_" + Date.now();
  const script = document.createElement("script");
  let terminado = false;

  estado.className = "card cargando";
  estado.innerHTML = "⏳ <strong>Cargando catálogo TRIMA...</strong>";

  window[callback] = function(respuesta) {
    terminado = true;

    try {
      if (!respuesta || respuesta.ok !== true || !Array.isArray(respuesta.catalogo)) {
        throw new Error("No se recibió un catálogo válido.");
      }

      catalogo = respuesta.catalogo;
      construirIndice();
      catalogoListo = true;

      $("busqueda").disabled = false;
      $("btnBuscar").disabled = false;
      $("btnScanner").disabled = false;

      estado.className = "card listo";
      estado.innerHTML =
        "✅ <strong>SISTEMA LISTO</strong><br>" +
        catalogo.length + " artículos cargados.";
    } catch (error) {
      mostrarErrorCatalogo(error.message);
    } finally {
      try { delete window[callback]; } catch(e) {}
      script.remove();
    }
  };

  script.onerror = function() {
    if (terminado) return;
    terminado = true;
    try { delete window[callback]; } catch(e) {}
    script.remove();
    mostrarErrorCatalogo("No fue posible conectar con TRIMA.");
  };

  script.src =
    API_URL +
    "?accion=catalogo" +
    "&callback=" + encodeURIComponent(callback) +
    "&_=" + Date.now();

  document.body.appendChild(script);

  setTimeout(function() {
    if (!terminado && !catalogoListo) {
      mostrarErrorCatalogo("La carga del catálogo tardó demasiado. Recarga la página.");
    }
  }, 45000);
}

function mostrarErrorCatalogo(mensaje) {
  const estado = $("estadoSistema");
  estado.className = "card error";
  estado.innerHTML =
    "❌ <strong>NO SE PUDO CARGAR EL CATÁLOGO</strong><br>" +
    escaparHTML(mensaje);
}

function construirIndice() {
  indiceCatalogo.clear();

  for (const producto of catalogo) {
    const proveedor = normalizarCodigo(producto.codigoProveedor);
    const barras = normalizarCodigo(producto.codigoBarras);

    if (proveedor && !indiceCatalogo.has(proveedor)) {
      indiceCatalogo.set(proveedor, producto);
    }

    if (barras && !indiceCatalogo.has(barras)) {
      indiceCatalogo.set(barras, producto);
    }
  }
}

/* =====================================================
   2. BÚSQUEDA LOCAL INMEDIATA
===================================================== */
function procesarCodigo(codigo) {
  const inicio = performance.now();
  const clave = normalizarCodigo(codigo);

  if (!clave || !catalogoListo) return;

  $("busqueda").value = clave;

  const producto = indiceCatalogo.get(clave);

  if (!producto) {
    limpiarProducto();
    alert("Producto no encontrado en el catálogo TRIMA.\n\nCódigo: " + clave);
    return;
  }

  productoActual = producto;
  codigoActual = clave;

  mostrarProducto(producto);

  $("tiempoBusqueda").textContent =
    "Búsqueda local: " + Math.round(performance.now() - inicio) + " ms";
}

function buscarManual() {
  procesarCodigo($("busqueda").value);
}

function mostrarProducto(producto) {
  const desactivado =
    producto.desactivado === true ||
    ["DESACTIVADO","NO"].includes(normalizarCodigo(producto.estadoArticulo));

  const estado = $("estadoProducto");
  estado.className =
    "estadoProducto " + (desactivado ? "productoDesactivado" : "productoActivo");
  estado.textContent =
    desactivado ? "🔴 ARTÍCULO DESACTIVADO" : "🟢 ARTÍCULO ACTIVO";

  $("descripcion").textContent = producto.descripcion || "";
  $("codigoProveedor").textContent = producto.codigoProveedor || "";
  $("codigoBarras").textContent = producto.codigoBarras || "";
  $("idERP").textContent = producto.id || "";
  $("stockERP").textContent = producto.stockERP ?? "";

  $("producto").style.display = "block";
  prepararConteo();

  setTimeout(function() {
    $("producto").scrollIntoView({behavior:"smooth", block:"start"});
  }, 50);
}

function prepararConteo() {
  $("zonaConteo").style.display = "block";
  $("conteoFisico").value = "";
  $("resultadoGuardado").style.display = "none";
  $("btnSiguiente").style.display = "none";

  $("btnCoincide").disabled = false;
  $("btnCoincide").textContent = "✓ STOCK FÍSICO COINCIDE CON ERP";

  $("btnGuardarConteo").disabled = false;
  $("btnGuardarConteo").textContent = "GUARDAR CONTEO FÍSICO";
}

function limpiarProducto() {
  productoActual = null;
  codigoActual = "";
  $("producto").style.display = "none";
  $("zonaConteo").style.display = "none";
}

/* =====================================================
   3. ESCÁNER
   Se conserva la configuración de cámara que funcionó
   correctamente en iPhone.
===================================================== */
function detenerScanner() {
  try {
    if (controles) {
      controles.stop();
      controles = null;
    }
  } catch(e) {}

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
}

async function iniciarScanner() {
  if (!catalogoListo) {
    alert("Espera a que aparezca SISTEMA LISTO.");
    return;
  }

  detenerScanner();
  detectado = false;
  limpiarProducto();

  const video = $("video");
  const visor = $("visor");
  const estado = $("estadoScanner");

  visor.style.display = "block";
  estado.style.display = "block";
  estado.innerHTML = "📷 Abriendo cámara trasera...";

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        frameRate: { ideal: 30 }
      }
    });

    video.srcObject = stream;
    await video.play();

    const track = stream.getVideoTracks()[0];
    let capabilities = {};

    if (typeof track.getCapabilities === "function") {
      capabilities = track.getCapabilities();
    }

    const advanced = [];

    if (
      capabilities.focusMode &&
      Array.isArray(capabilities.focusMode) &&
      capabilities.focusMode.includes("continuous")
    ) {
      advanced.push({ focusMode: "continuous" });
    }

    if (
      capabilities.zoom &&
      typeof capabilities.zoom.min === "number" &&
      typeof capabilities.zoom.max === "number"
    ) {
      let zoomDeseado = Math.max(capabilities.zoom.min, 1.2);
      zoomDeseado = Math.min(zoomDeseado, capabilities.zoom.max);
      advanced.push({ zoom: zoomDeseado });
    }

    if (advanced.length > 0) {
      try {
        await track.applyConstraints({ advanced: advanced });
      } catch(e) {
        console.log("Constraints avanzados:", e);
      }
    }

    estado.innerHTML =
      "🔎 <strong>LECTOR ACTIVO</strong><br>" +
      "Mantén el código dentro del marco.";

    const lector = new ZXingBrowser.BrowserMultiFormatReader();

    controles = await lector.decodeFromStream(
      stream,
      video,
      function(resultadoZXing, error, controlActual) {
        if (!resultadoZXing || detectado) return;

        const texto = resultadoZXing.getText();
        if (!texto) return;

        detectado = true;

        try { controlActual.stop(); } catch(e) {}

        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        }

        visor.style.display = "none";
        estado.innerHTML =
          "🎯 Código leído: <strong>" + escaparHTML(texto) + "</strong>";

        procesarCodigo(texto);
      }
    );

  } catch(error) {
    console.error(error);
    estado.style.display = "block";
    estado.innerHTML =
      "❌ No fue posible iniciar la cámara.<br>" +
      escaparHTML(error.message);
  }
}

/* =====================================================
   4. CONTEO
   Un producto -> una escritura -> siguiente.
   No hay segunda búsqueda ni reverificación.
===================================================== */
async function confirmarStockERP() {
  if (!productoActual || !codigoActual || guardando) return;

  const stock = Number(productoActual.stockERP) || 0;
  await registrarConteo(stock);
}

async function guardarConteoFisico() {
  if (!productoActual || !codigoActual || guardando) return;

  const campo = $("conteoFisico");
  const texto = String(campo.value ?? "").trim();

  if (texto === "") {
    alert("Captura la cantidad física encontrada.");
    campo.focus();
    return;
  }

  const conteo = Number(texto);

  if (!Number.isFinite(conteo) || conteo < 0) {
    alert("Captura una cantidad válida.");
    campo.focus();
    return;
  }

  await registrarConteo(conteo);
}

async function registrarConteo(conteo) {
  guardando = true;

  $("btnCoincide").disabled = true;
  $("btnGuardarConteo").disabled = true;

  const textoCoincide = $("btnCoincide").textContent;
  const textoGuardar = $("btnGuardarConteo").textContent;

  $("btnCoincide").textContent = "GUARDANDO...";
  $("btnGuardarConteo").textContent = "GUARDANDO...";

  try {
    await enviarConteo(codigoActual, conteo);
    mostrarGuardado(conteo);
  } catch(error) {
    console.error(error);
    alert("No fue posible guardar el conteo. No se registró como terminado.");

    $("btnCoincide").disabled = false;
    $("btnGuardarConteo").disabled = false;
    $("btnCoincide").textContent = textoCoincide;
    $("btnGuardarConteo").textContent = textoGuardar;
  } finally {
    guardando = false;
  }
}

async function enviarConteo(codigo, conteo) {
  const datos = new URLSearchParams();
  datos.append("accion", "guardarPorCodigo");
  datos.append("codigo", codigo);
  datos.append("conteo", String(conteo));

  const respuesta = await fetch(API_URL, {
    method: "POST",
    body: datos
  });

  if (!respuesta.ok) {
    throw new Error("Error HTTP " + respuesta.status);
  }

  return true;
}

function mostrarGuardado(conteo) {
  const stock = Number(productoActual.stockERP) || 0;
  const diferencia = Number(conteo) - stock;

  $("resultadoGuardado").innerHTML =
    "✅ CONTEO REGISTRADO<br><br>" +
    "Stock ERP: " + stock + "<br>" +
    "Conteo físico: " + conteo + "<br>" +
    "Diferencia: " + diferencia;

  $("resultadoGuardado").style.display = "block";

  $("btnCoincide").textContent = "✓ CONTEO REGISTRADO";
  $("btnGuardarConteo").textContent = "CONTEO REGISTRADO";
  $("btnSiguiente").style.display = "block";

  $("btnSiguiente").scrollIntoView({behavior:"smooth", block:"center"});
}

/* =====================================================
   5. SIGUIENTE PRODUCTO
===================================================== */
function siguienteProducto() {
  productoActual = null;
  codigoActual = "";

  $("producto").style.display = "none";
  $("zonaConteo").style.display = "none";
  $("resultadoGuardado").style.display = "none";
  $("conteoFisico").value = "";
  $("busqueda").value = "";
  $("estadoScanner").style.display = "none";

  iniciarScanner();
}

/* =====================================================
   EVENTOS
===================================================== */
$("btnBuscar").addEventListener("click", buscarManual);
$("btnScanner").addEventListener("click", iniciarScanner);
$("btnCoincide").addEventListener("click", confirmarStockERP);
$("btnGuardarConteo").addEventListener("click", guardarConteoFisico);
$("btnSiguiente").addEventListener("click", siguienteProducto);

$("busqueda").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    buscarManual();
  }
});

window.addEventListener("pagehide", detenerScanner);

document.addEventListener("DOMContentLoaded", cargarCatalogo);
</script>
</body>
</html>
